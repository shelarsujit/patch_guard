# mini-swe-agent configuration for the Patch-Guard baseline.
#
# This is a fair baseline, not a strawman. It runs unmodified upstream
# mini-swe-agent (the ~100-line agent that scores >74% on SWE-bench Verified)
# against the same cases, the same worker model, the same temperature and the
# same cassette discipline as the supervisor. It is even told, in the same
# words as the guarded run, that tests are off limits.
#
# It is also given the SAME starting information the supervisor hands its
# worker: the path of the buggy file and its full contents. The supervisor gets
# that for free from its `localize` node, so withholding it here would have made
# the baseline spend its whole budget rediscovering what the supervisor is
# simply told -- an asymmetry in the supervisor's favour.
#
# The single-line-command instruction is a provider constraint, not a handicap:
# gpt-oss-20b writes multi-line heredocs, which are not valid inside a JSON
# tool-call argument, and Groq rejects the whole request with "Failed to parse
# tool call arguments as JSON" before the agent can act. Any that still slip
# through are routed into mini-swe-agent's own FormatError retry path by
# baseline/resilient_model.py.
#
# The only thing the baseline lacks is supervision: nothing verifies its work,
# nothing checks for regressions, and nothing stops it submitting. Whatever gap
# the numbers show is attributable to the gates, not to a handicapped prompt.

agent:
  # step_limit is injected from patch_guard.config.BASELINE_STEP_LIMIT at load
  # time so the budget has a single source of truth. It is documented there,
  # and the fairness claim in the README depends on it actually being applied.
  cost_limit: 0.0          # cost tracking is not the constraint here

  # gpt-oss-20b uses the harmony format, where reasoning and the final answer
  # are separate channels. It intermittently spends a whole turn in the
  # reasoning channel and returns an empty final one with no tool call --
  # measured at finish_reason=stop with ~418 completion tokens, all reasoning.
  # mini-swe-agent's own recovery handles this well: it appends "No tool calls
  # found in the response", which changes the prompt, and the next turn
  # normally acts. Runs were dying only on three of these in a row.
  #
  # Raised from the default 3. This is deliberately an allowance in the
  # BASELINE's favour -- it gives the unsupervised agent more chances to
  # produce a patch, so the gap the gates reveal cannot be blamed on the
  # baseline being cut off early.
  max_consecutive_format_errors: 8

  system_template: |
    You are a careful software engineer fixing a bug in a small Python repository.

    You work by issuing shell commands with the bash tool, one at a time.
    You are already in the repository root.

    Rules:
    1. Fix the implementation only. Files under `python_testcases/` and
       `json_testcases/`, and `conftest.py`, must not be modified.
    2. Change as little as possible. Keep function names and signatures.
    3. If the tests contradict the module's documented behaviour, say so
       instead of changing code to make them pass.
    4. When you are done, run: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

    IMPORTANT: keep every command on a SINGLE line. Multi-line heredocs cannot
    be encoded in a tool call and will be rejected by the API.

    To rewrite a file, use printf with one quoted argument per line:
      printf '%s\n' 'def add(a, b):' '    return a + b' > python_programs/add.py

    To run the target tests:
      python -m pytest python_testcases/test_add.py -q -p no:cacheprovider

  instance_template: |
    {{task}}

environment:
  cwd: "."
  timeout: 30
